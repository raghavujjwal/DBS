<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-subtle: #1f6feb22;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .topbar .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      white-space: nowrap;
    }
    .topbar nav { display: flex; gap: 20px; flex-wrap: wrap; }
    .topbar nav a { color: var(--text-muted); font-size: 0.9rem; }
    .topbar nav a:hover, .topbar nav a.active { color: var(--text); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; color: var(--text); }
    h2 { font-size: 1.5rem; margin: 32px 0 16px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h3 { font-size: 1.15rem; margin: 24px 0 12px; color: var(--text); }
    h4 { font-size: 1rem; margin: 16px 0 8px; color: var(--text-muted); }
    p, li { color: var(--text); margin-bottom: 8px; }
    ul, ol { padding-left: 24px; }
    code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    pre code { border: none; padding: 0; background: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.92rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    th { background: var(--surface); color: var(--text); font-weight: 600; }
    tr:nth-child(even) { background: var(--surface); }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-factual { background: #1f6feb33; color: var(--accent); }
    .badge-conceptual { background: #8957e533; color: var(--purple); }
    .badge-solving { background: #3fb95033; color: var(--green); }
    .badge-high { background: #f8514933; color: var(--red); }
    .badge-medium { background: #d2992233; color: var(--yellow); }
    .badge-low { background: #30363d; color: var(--text-muted); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .card p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }

    .freq-bar {
      height: 8px;
      border-radius: 4px;
      background: var(--border);
      margin: 6px 0;
      overflow: hidden;
    }
    .freq-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
    }
    .toc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 24px; margin: 20px 0; }
    .toc ul { list-style: none; padding: 0; }
    .toc li { padding: 4px 0; }
    blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 12px 0;
      color: var(--text-muted);
      background: var(--accent-subtle);
      border-radius: 0 6px 6px 0;
    }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
    footer { text-align: center; padding: 32px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 48px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="logo">DBS Study Guide</span>
      <nav>
        <a href="{{ site.baseurl }}/" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ site.baseurl }}/topics/" {% if page.url contains '/topics' %}class="active"{% endif %}>Topics</a>
        <a href="{{ site.baseurl }}/pyq/" {% if page.url contains '/pyq' %}class="active"{% endif %}>PYQ Breakdown</a>
        <a href="{{ site.baseurl }}/reference/" {% if page.url contains '/reference' %}class="active"{% endif %}>Quick Reference</a>
      </nav>
    </div>
  </div>
  <div class="container">
    {{ content }}
  </div>
  <footer>CS F212 Database Systems &mdash; BITS Pilani &mdash; Study Guide</footer>
</body>
</html>
